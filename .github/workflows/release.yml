name: Build & Release

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

# a newer push to the same branch makes the running build obsolete; tags keep
# their own group so a release build is never cancelled by a follow-up commit
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ github.ref_type != 'tag' }}

# build jobs only need to read the repo; the release token is granted to publish alone
permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - run: npm run build

      - name: Package
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # The certificate is a macOS Developer ID; electron-builder would also
          # pick CSC_LINK up for Windows code signing, so drop it elsewhere.
          if [ "$RUNNER_OS" != "macOS" ]; then
            unset CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          # Notarization costs several minutes per build and only matters for
          # artifacts users actually install, so keep it for tagged releases.
          # Signing still runs on every build, which is what usually breaks.
          if [ "$GITHUB_REF_TYPE" != "tag" ]; then
            unset APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID
          fi
          # Missing secrets arrive as empty strings; electron-builder treats an
          # empty CSC_LINK as a certificate to import, so unset empty vars to
          # fall back to an unsigned, un-notarized build.
          for v in CSC_LINK CSC_KEY_PASSWORD APPLE_ID APPLE_APP_SPECIFIC_PASSWORD APPLE_TEAM_ID; do
            if [ -z "${!v}" ]; then unset "$v"; fi
          done
          npx electron-builder --publish never

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: dist-${{ matrix.os }}
          retention-days: ${{ github.ref_type == 'tag' && 30 || 7 }}
          path: |
            release/*.dmg
            release/*.zip
            release/*.exe
            release/*.AppImage
            release/*.deb
            release/*.blockmap
            release/latest*.yml

  # Publishing happens in a single job after all builds succeed, so
  # parallel matrix jobs never race to create the same GitHub release.
  # Ordinary pushes stop after build and leave their installers as artifacts.
  publish:
    needs: build
    if: github.ref_type == 'tag' || github.event_name == 'workflow_dispatch'
    runs-on: app-simple-prod-new
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          path: dist
          merge-multiple: true

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "$GITHUB_REF_TYPE" = "tag" ]; then
            TAG="$GITHUB_REF_NAME"
          else
            TAG="v$(node -p "require('./package.json').version")"
          fi
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" dist/* --title "${TAG#v}" --generate-notes --repo "$GITHUB_REPOSITORY"
          fi
